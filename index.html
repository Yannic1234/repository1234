<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wettervorhersage</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Animated weather background with layered effects -->
    <div id="weatherBg">
      <div class="bg-layer bg-layer-2"></div>
      <div class="bg-layer bg-layer-3"></div>
    </div>

    <!-- Theme toggle: auto / light / dark -->
    <button id="themeToggle" class="theme-toggle" title="Theme wechseln" aria-label="Theme wechseln">
      <span id="themeIcon">🌗</span>
    </button>

    <div class="app-layout">

      <!-- ─── Sidebar ──────────────────────────────────────── -->
      <aside class="sidebar glass">

        <!-- Hero: location name + temperature (shown immediately, top-left) -->
        <div class="sidebar-hero">
          <div class="sidebar-header">
            <h1 id="locationName">Dresden</h1>
            <div id="weatherIndicator" class="weather-badge hidden">
              <span id="weatherIcon"></span>
              <span id="weatherLabel"></span>
            </div>
          </div>

          <div class="current-temp-row">
            <span class="temp-big" id="currentTempBig">–</span>
            <span class="temp-unit">°C</span>
          </div>

          <div class="feels-like-row">
            <span class="feels-label">Gefühlt</span>
            <span class="feels-value" id="feelsLike">–</span>
          </div>
        </div>

        <div class="hours-row">
          <span>Vorhersagedauer</span>
          <div class="hours-input-wrap">
            <input id="hoursInput" type="number" min="6" max="72" value="24" />
            <span>h</span>
          </div>
        </div>

        <p id="status" class="status">Bereit.</p>

        <!-- ─── Stats grid (all square) ──────────────────── -->
        <div class="stats-grid">

          <div class="stat-card glass-inner">
            <span class="stat-label">Wind</span>
            <div class="stat-wind-row">
              <svg id="windArrow" class="wind-svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2.2"
                   stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <!-- Arrow pointing up; rotated by JS: 0° = from north, +180° for "blowing toward" -->
                <line x1="12" y1="20" x2="12" y2="4"/>
                <polyline points="5 11 12 4 19 11"/>
              </svg>
              <span class="stat-value" id="windSpeed">–</span>
            </div>
            <span class="stat-sub" id="windDirText">–</span>
          </div>

          <div class="stat-card glass-inner">
            <span class="stat-label">Feuchtigkeit</span>
            <span class="stat-value" id="humidity">–</span>
          </div>

          <div class="stat-card glass-inner">
            <span class="stat-label">Luftdruck</span>
            <span class="stat-value" id="pressure">–</span>
          </div>

          <div class="stat-card glass-inner">
            <span class="stat-label">Sichtweite</span>
            <span class="stat-value" id="visibility">–</span>
          </div>

          <div class="stat-card glass-inner">
            <span class="stat-label">Aufgang</span>
            <span class="stat-value" id="sunrise">–</span>
          </div>

          <div class="stat-card glass-inner">
            <span class="stat-label">Untergang</span>
            <span class="stat-value" id="sunset">–</span>
          </div>

          <div class="stat-card glass-inner">
            <span class="stat-label">UV-Index</span>
            <span class="stat-value" id="currentUV">–</span>
          </div>

          <div class="stat-card glass-inner">
            <span class="stat-label">Niederschlag</span>
            <span class="stat-value" id="currentPrecip">–</span>
          </div>

        </div>

        <!-- ─── Moon phase ────────────────────────────────── -->
        <div class="moon-section glass-inner">
          <div class="moon-header">
            <span class="stat-label">Mondphase</span>
            <span class="moon-name" id="moonPhaseName">–</span>
          </div>
          <div class="moon-display">
            <canvas id="moonCanvas" width="56" height="56" aria-label="Mondphase"></canvas>
            <div class="moon-info">
              <span class="moon-illumination" id="moonIllumination">–</span>
            </div>
          </div>
        </div>

        <!-- ─── Air quality scale ─────────────────────────── -->
        <div class="aqi-section glass-inner">
          <div class="aqi-header">
            <span class="stat-label">Luftqualität (AQI)</span>
            <span class="aqi-value" id="aqiValue">–</span>
          </div>
          <div class="aqi-bar-wrap">
            <div class="aqi-gradient-bar">
              <div class="aqi-marker-line" id="aqiMarker" style="left:0%"></div>
            </div>
            <div class="aqi-labels">
              <span>Gut</span>
              <span>Mittel</span>
              <span>Schlecht</span>
            </div>
          </div>
          <span class="aqi-desc" id="aqiDesc">–</span>
        </div>

      </aside>

      <!-- ─── Charts ───────────────────────────────────────── -->
      <main class="charts-main">
        <section class="chart-section glass">
          <h2>Temperatur (°C)</h2>
          <canvas id="tempChart"></canvas>
        </section>
        <section class="chart-section glass">
          <h2>Regenmenge (mm/h)</h2>
          <canvas id="rainChart"></canvas>
        </section>
        <section class="chart-section glass">
          <h2>UV-Index</h2>
          <canvas id="uvChart"></canvas>
        </section>
      </main>

    </div>

    <!-- ─── Bottom search bar (centered) ─────────────────────── -->
    <div class="bottom-bar">
      <div class="location-search-wrap glass">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="locationInput" type="search" placeholder="Ort eingeben …" value="Dresden" autocomplete="off" />
        <button id="loadBtn" title="Vorhersage laden">↺</button>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
